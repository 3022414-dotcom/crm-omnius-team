name: PR Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

# No deployment secrets are used in this workflow (FR-008).
permissions:
  contents: read
  pull-requests: write

jobs:
  frontend:
    name: Frontend (lint · build · image)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Build (vite)
        run: npm run build
      - name: Docker build (frontend image)
        working-directory: .
        run: docker build -t crm-frontend:pr ./client

  backend:
    name: Backend (lint · test · image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint (if configured)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "skipped: no backend lint script configured"
          fi
      - name: Test (if configured)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "skipped: no backend test script configured"
          fi
      - name: Docker build (backend image)
        run: docker build -t crm-backend:pr .

  security:
    name: Security scan (Trivy — vuln + secret)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: .trivyignore

  version-gate:
    name: Version bump gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure base ref is available
        run: git fetch origin "${{ github.base_ref }}"
      - name: Check VERSION was bumped for deployable changes
        run: bash scripts/ci/check-version-bump.sh "origin/${{ github.base_ref }}"
