services:
  postgres:
    image: postgres:15-alpine
    container_name: omnius_crm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omnius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnius_secret}
      POSTGRES_DB: ${POSTGRES_DB:-omnius_crm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omnius} -d ${POSTGRES_DB:-omnius_crm}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: omnius_crm_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-omnius}:${POSTGRES_PASSWORD:-omnius_secret}@postgres:5432/${POSTGRES_DB:-omnius_crm}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
